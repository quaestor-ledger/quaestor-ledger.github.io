name: site-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test production artifact
        run: npm test
      - name: Reject merge artifacts and insecure assets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- src public tests
          ! grep -RInE '(href|src)="http://' -- src
          ! grep -RInE 'url\([^)]*http://' -- src
