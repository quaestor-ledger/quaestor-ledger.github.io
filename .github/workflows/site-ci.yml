name: site-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run site contracts
        run: node --test tests/site-contract.test.mjs
      - name: Reject merge artifacts and unsafe absolute HTTP assets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- index.html styles.css tests
          ! grep -RInE '(href|src)="http://' -- index.html
          ! grep -RInE 'url\(["'"']?http://' -- styles.css
